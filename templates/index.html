<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wildlife Monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    .htmx-request {
      opacity: 0.6;
    }

    .htmx-request .img-btn {
      pointer-events: none;
    }

    .htmx-indicator {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      z-index: 1000;
    }

    .htmx-request .htmx-indicator {
      display: block;
    }

    .img-btn {
      position: relative;
    }
  </style>
</head>

<body>

  <div class="app">
    <!-- Sidebar -->
    <div class="side">
      <img src="{{ url_for('static', filename='assets/Monash_University_logo.svg') }}" alt="Button 1">
      <div class="sidebar">
        <div class="logo"></div>
        <div class="icon"></div>
        <div class="icon"></div>
        <div class="icon"></div>
      </div>
    </div>

    <!-- Main content -->
    <div class="main">

      <div class="col_1">
        <div class="box big">
          <img class="video" src="{{ url_for('video_feed') }}" />

          <div class="col_2">

            <button class="img-btn" hx-post="/screenshot" hx-target="#status-content" hx-swap="innerHTML"
              hx-indicator="#screenshot-loading">
              <img src="{{ url_for('static', filename='assets/ss_button.png') }}" alt="Screenshot">
              <div id="screenshot-loading" class="htmx-indicator">📸</div>
            </button>

            <button class="img-btn" hx-post="/record" hx-target="#record-btn-content" hx-swap="outerHTML"
              hx-indicator="#record-loading">
              <div id="record-btn-content">
                <img src="{{ url_for('static', filename='assets/record_button.png') }}" alt="Record">
              </div>
              <div id="record-loading" class="htmx-indicator">🔄</div>
            </button>

            <button class="img-btn" hx-post="/audio/toggle" hx-target="#audio-toggle-content" hx-swap="outerHTML"
              style="background: #333; color: white; border-radius: 10px; padding: 10px; font-size: 20px;">
              <div id="audio-toggle-content">
                ⏸️
              </div>
            </button>
          </div>
        </div>
      </div>



      <div class="col_3">
        <div class="box right-top">
          <h2>Visual Sightings</h2>
          <div id="sightings-content" hx-get="/sightings" hx-trigger="load" hx-swap="innerHTML">
            Loading sightings...
          </div>
        </div>
        <div class="box audio-middle">
          <h2>Audio Sightings</h2>
          <div id="audio-sightings-content" hx-get="/audio/sightings" hx-trigger="load" hx-swap="innerHTML">
            Loading audio classifications...
          </div>
        </div>
        <div class="box bottom-right">
          <h2>Status</h2>
          <div id="status-content" hx-get="/status" hx-trigger="load" hx-swap="innerHTML">
            Loading status...
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
<script>
  // HTMX event listeners for additional functionality
  document.body.addEventListener('htmx:afterRequest', function (event) {
    if (event.detail.xhr.status >= 200 && event.detail.xhr.status < 300) {
      console.log('Request successful:', event.detail.pathInfo.requestPath);
    } else {
      console.error('Request failed:', event.detail.pathInfo.requestPath);
    }
  });

  document.body.addEventListener('htmx:responseError', function (event) {
    console.error('HTMX Error:', event.detail);
    if (event.detail.target.id === 'status-content') {
      event.detail.target.innerHTML = '<p style="color: red;">Connection Error</p>';
    }
  });

  // Auto-refresh status every 5 seconds
  setInterval(() => {
    htmx.ajax('GET', '/status', { target: '#status-content', swap: 'innerHTML' });
    htmx.ajax('GET', '/sightings', { target: '#sightings-content', swap: 'innerHTML' });
    htmx.ajax('GET', '/audio/sightings', { target: '#audio-sightings-content', swap: 'innerHTML' });
  }, 5000);
</script>

</html>
